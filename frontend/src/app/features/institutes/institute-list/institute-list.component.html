<div class="space-y-8 animate-fade-in-up">
  
  <!-- Header de la sección -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Institutos</h1>
      <p class="text-zinc-400 mt-1">Gestiona los centros de entrenamiento registrados en la plataforma.</p>
    </div>
    <!-- Botón primario en móvil (en desktop tienen el ghost card) -->
    <button (click)="openAddDrawer()" class="md:hidden flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-sky-600 hover:from-cyan-400 hover:to-sky-500 text-white px-5 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-cyan-500/20">
      <lucide-icon [img]="PlusIcon" class="w-5 h-5"></lucide-icon>
      Nuevo Instituto
    </button>
  </div>

  <!-- Grid de Tarjetas -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    
    <!-- Iteramos sobre el signal de institutos -->
    @for (institute of institutes(); track institute.id) {
      <article class="group relative bg-zinc-900 border border-zinc-800 p-6 rounded-2xl hover:-translate-y-1 hover:border-cyan-500/50 hover:shadow-[0_8px_30px_rgb(0,204,204,0.1)] transition-all duration-300 flex flex-col h-full">
        
        <!-- Acciones Flotantes (Visibles en hover desktop, siempre en móvil) -->
        <div class="absolute top-4 right-4 flex items-center gap-2 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          <button (click)="openEditDrawer(institute)" class="p-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-cyan-400 rounded-lg transition-colors border border-zinc-700 hover:border-cyan-500/50" title="Editar">
            <lucide-icon [img]="EditIcon" class="w-4 h-4"></lucide-icon>
          </button>
          <button (click)="confirmDelete(institute)" class="p-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-rose-400 rounded-lg transition-colors border border-zinc-700 hover:border-rose-500/50" title="Eliminar">
            <lucide-icon [img]="TrashIcon" class="w-4 h-4"></lucide-icon>
          </button>
        </div>

        <div class="flex items-center gap-4 mb-6 mt-2 pr-24 md:pr-0">
          <div class="w-12 h-12 rounded-xl bg-zinc-800 group-hover:bg-gradient-to-br group-hover:from-cyan-500 group-hover:to-sky-600 flex items-center justify-center text-zinc-400 group-hover:text-white transition-all duration-500 shadow-inner shrink-0">
            <lucide-icon [img]="BuildingIcon" class="w-6 h-6"></lucide-icon>
          </div>
          <div class="overflow-hidden">
            <h3 class="text-xl font-bold text-white leading-tight group-hover:text-cyan-400 transition-colors truncate">{{ institute.name }}</h3>
            <span class="text-xs text-zinc-500 font-mono">ID: {{ institute.id.substring(0, 8) }}</span>
          </div>
        </div>

        <div class="mt-auto pt-4 border-t border-zinc-800/50">
          <div class="flex items-center gap-3 text-zinc-400 text-sm group-hover:text-zinc-300 transition-colors">
            <lucide-icon [img]="PhoneIcon" class="w-4 h-4 text-sky-500"></lucide-icon>
            <span class="font-medium truncate">{{ institute.contactPhone }}</span>
          </div>
        </div>
      </article>
    }

    <!-- GHOST CARD (Para agregar nuevo instituto) -->
    <button (click)="openAddDrawer()" class="hidden md:flex flex-col items-center justify-center gap-4 bg-zinc-950 border-2 border-dashed border-zinc-800 rounded-2xl min-h-[200px] hover:border-cyan-500/50 hover:bg-zinc-900/50 transition-all duration-300 group">
      <div class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-500 group-hover:text-cyan-400 group-hover:scale-110 group-hover:bg-cyan-500/10 group-hover:border-cyan-500/30 transition-all duration-300">
        <lucide-icon [img]="PlusIcon" class="w-6 h-6"></lucide-icon>
      </div>
      <span class="text-zinc-500 font-medium group-hover:text-cyan-400 transition-colors">Agregar Nuevo Instituto</span>
    </button>

  </div>
</div>
