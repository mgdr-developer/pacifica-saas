<!-- CARTUCHO: MODAL DE CONFIRMACIÓN (Dark Glassmorphism) -->
<div class="p-6 md:p-8 flex flex-col gap-6 relative">
  
  <!-- Glow superior decorativo según el tipo de acción -->
  <div 
    class="absolute top-0 left-0 right-0 h-1"
    [ngClass]="data.type === 'danger' ? 'bg-gradient-to-r from-rose-500 to-red-600' : 'bg-gradient-to-r from-cyan-500 to-sky-600'">
  </div>

  <!-- Botón de cierre superior (X) -->
  <button 
    (click)="onCancel()" 
    class="absolute top-5 right-5 text-zinc-500 hover:text-white transition-colors bg-zinc-800/50 hover:bg-zinc-800 p-2 rounded-full border border-zinc-700/50"
    aria-label="Cerrar modal">
    <lucide-icon [img]="XIcon" class="w-4 h-4"></lucide-icon>
  </button>

  <!-- Encabezado con Icono y Título -->
  <div class="flex items-start gap-4 pr-8">
    <div 
      class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 border"
      [ngClass]="data.type === 'danger' 
        ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' 
        : 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400'">
      
      @if (data.type === 'danger') {
        <lucide-icon [img]="AlertTriangleIcon" class="w-6 h-6"></lucide-icon>
      } @else if (data.type === 'warning') {
        <lucide-icon [img]="AlertCircleIcon" class="w-6 h-6"></lucide-icon>
      } @else {
        <lucide-icon [img]="InfoIcon" class="w-6 h-6"></lucide-icon>
      }
    </div>

    <div class="space-y-1">
      <h3 class="text-xl md:text-2xl font-bold text-zinc-50 tracking-tight">
        {{ data.title }}
      </h3>
      <p class="text-xs text-zinc-500 font-medium uppercase tracking-wider">
        Confirmación de Acción
      </p>
    </div>
  </div>

  <!-- Cuerpo del Mensaje -->
  <div class="text-zinc-300 text-sm md:text-base leading-relaxed pl-1">
    <p>{{ data.message }}</p>
  </div>

  <!-- Acciones (Botones Cancelar / Confirmar) -->
  <div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 pt-4 border-t border-zinc-800/80">
    <button 
      type="button" 
      (click)="onCancel()"
      class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-sm font-medium text-zinc-300 bg-zinc-800/80 hover:bg-zinc-800 border border-zinc-700/60 hover:text-white transition-all duration-200">
      {{ data.cancelText || 'Cancelar' }}
    </button>

    <button 
      type="button" 
      (click)="onConfirm()"
      class="w-full sm:w-auto px-6 py-2.5 rounded-xl text-sm font-semibold text-white transition-all duration-200 hover:-translate-y-0.5"
      [ngClass]="data.type === 'danger' 
        ? 'bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 shadow-lg shadow-rose-500/20 hover:shadow-rose-500/40' 
        : 'bg-gradient-to-r from-cyan-500 to-sky-600 hover:from-cyan-400 hover:to-sky-500 shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40'">
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>

</div>
